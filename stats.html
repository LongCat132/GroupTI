<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GroupTI 数据统计</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #16162a;
      --accent: #e94560;
      --text: #ffffff;
      --muted: #a0a0b0;
      --border: #2a2a4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans SC", "Segoe UI", sans-serif;
      padding: 28px;
    }

    .shell {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .hint {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    .panel,
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .panel {
      padding: 18px;
      margin-bottom: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    input[type="file"] {
      color: var(--muted);
    }

    button {
      border: 1px solid var(--border);
      background: var(--accent);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0b14;
      color: var(--text);
      padding: 12px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .card {
      padding: 16px;
    }

    .metric {
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 18px;
    }

    .bar-row {
      margin-bottom: 12px;
    }

    .bar-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 5px;
    }

    .bar-track {
      height: 9px;
      background: #0b0b14;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0 4px;
    }

    @media (max-width: 800px) {
      body {
        padding: 18px;
      }

      .grid,
      .two-col {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>GroupTI 数据统计</h1>
    <p class="hint">从 Google Sheet 下载 CSV 后导入这里。这个页面只在本地浏览器里分析文件，不会上传数据。</p>

    <section class="panel">
      <div class="controls">
        <input type="file" id="csvFile" accept=".csv,text/csv">
        <button id="loadSampleBtn">载入粘贴内容</button>
      </div>
      <textarea id="csvText" placeholder="也可以把 Google Sheet 导出的 CSV 内容粘贴到这里，然后点击「载入粘贴内容」。"></textarea>
    </section>

    <section id="summary" class="grid"></section>

    <section class="two-col">
      <div class="card">
        <h2 class="section-title">人格排行</h2>
        <div id="typeRank"></div>
      </div>
      <div class="card">
        <h2 class="section-title">角色分布</h2>
        <div id="roleRank"></div>
      </div>
    </section>

    <section class="card" style="margin-bottom:14px;">
      <h2 class="section-title">维度分布</h2>
      <div id="dimensionRank"></div>
    </section>

    <section class="card">
      <h2 class="section-title">最近记录</h2>
      <div id="recentRows"></div>
    </section>
  </main>

  <script>
    const headers = [
      'receivedAt',
      'schemaVersion',
      'questionVersion',
      'type',
      'role',
      'answers',
      'answerDetails',
      'scores',
      'pageUrl',
      'userAgent',
      'createdAtClient',
      'debug',
      'collectionMode'
    ];

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && inQuotes && next === '"') {
          value += '"';
          i++;
        } else if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(value);
          if (row.some(cell => cell.trim() !== '')) rows.push(row);
          row = [];
          value = '';
        } else {
          value += char;
        }
      }

      row.push(value);
      if (row.some(cell => cell.trim() !== '')) rows.push(row);
      return rows;
    }

    function toObjects(csvRows) {
      if (!csvRows.length) return [];
      const firstRow = csvRows[0].map(cell => cell.trim());
      const hasHeader = firstRow.includes('type') && firstRow.includes('role');
      const keys = hasHeader ? firstRow : headers;
      const rows = hasHeader ? csvRows.slice(1) : csvRows;

      return rows.map(row => {
        const item = {};
        keys.forEach((key, index) => {
          item[key] = row[index] || '';
        });
        return item;
      }).filter(item => item.type);
    }

    function countBy(rows, key) {
      return rows.reduce((acc, row) => {
        const value = row[key] || 'unknown';
        acc[value] = (acc[value] || 0) + 1;
        return acc;
      }, {});
    }

    function renderMetric(label, value) {
      return `<div class="card"><div class="metric">${value}</div><div class="label">${label}</div></div>`;
    }

    function renderBars(counts, total) {
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
      if (!entries.length) return '<div class="empty">暂无数据</div>';

      return entries.map(([name, count]) => {
        const percent = total ? Math.round(count / total * 100) : 0;
        return `
          <div class="bar-row">
            <div class="bar-meta"><strong>${name}</strong><span>${count} · ${percent}%</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${percent}%"></div></div>
          </div>
        `;
      }).join('');
    }

    function dimensionCounts(rows) {
      const dims = {
        '时间 C/D': { C: 0, D: 0 },
        '沟通 V/S': { V: 0, S: 0 },
        '决策 R/E': { R: 0, E: 0 },
        '执行 I/G': { I: 0, G: 0 }
      };

      rows.forEach(row => {
        const type = row.type || '';
        if (type.length !== 4) return;
        dims['时间 C/D'][type[0]]++;
        dims['沟通 V/S'][type[1]]++;
        dims['决策 R/E'][type[2]]++;
        dims['执行 I/G'][type[3]]++;
      });

      return dims;
    }

    function renderRecent(rows) {
      const recent = rows.slice(-12).reverse();
      if (!recent.length) return '<div class="empty">暂无数据</div>';

      return `
        <table>
          <thead>
            <tr><th>时间</th><th>类型</th><th>角色</th><th>模式</th></tr>
          </thead>
          <tbody>
            ${recent.map(row => `
              <tr>
                <td>${row.receivedAt || row.createdAtClient || '-'}</td>
                <td>${row.type || '-'}</td>
                <td>${row.role || '-'}</td>
                <td>${row.collectionMode || (row.debug === 'true' ? 'debug' : 'normal')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function render(rows) {
      const normalRows = rows.filter(row => row.debug !== 'true' && row.collectionMode !== 'debug-collect');
      const debugRows = rows.length - normalRows.length;
      const typeCounts = countBy(normalRows, 'type');
      const roleCounts = countBy(normalRows, 'role');
      const dimCounts = dimensionCounts(normalRows);

      document.getElementById('summary').innerHTML = [
        renderMetric('有效记录', normalRows.length),
        renderMetric('调试记录', debugRows),
        renderMetric('人格类型数', Object.keys(typeCounts).length),
        renderMetric('最近更新时间', normalRows.at(-1)?.receivedAt || '-')
      ].join('');

      document.getElementById('typeRank').innerHTML = renderBars(typeCounts, normalRows.length);
      document.getElementById('roleRank').innerHTML = renderBars(roleCounts, normalRows.length);
      document.getElementById('dimensionRank').innerHTML = Object.entries(dimCounts).map(([title, counts]) => `
        <div style="margin-bottom:18px;">
          <h3 style="margin:0 0 10px;font-size:15px;color:var(--muted);">${title}</h3>
          ${renderBars(counts, normalRows.length)}
        </div>
      `).join('');
      document.getElementById('recentRows').innerHTML = renderRecent(rows);
    }

    function loadCsvText(text) {
      const rows = toObjects(parseCsv(text.trim()));
      render(rows);
    }

    document.getElementById('csvFile').addEventListener('change', event => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        document.getElementById('csvText').value = reader.result;
        loadCsvText(reader.result);
      };
      reader.readAsText(file);
    });

    document.getElementById('loadSampleBtn').addEventListener('click', () => {
      loadCsvText(document.getElementById('csvText').value);
    });

    render([]);
  </script>
</body>
</html>
